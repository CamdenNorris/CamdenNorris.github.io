{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">

    <nav class="portfolio-topnav" aria-label="Primary navigation">

      <a class="portfolio-brand" href="{{ base_path }}/">
        Camden Norris
      </a>

      <div class="portfolio-topnav-links">

        <a
          class="portfolio-nav-link {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}"
          href="{{ base_path }}/">
          Home
        </a>

        <a
          class="portfolio-nav-link {% if page.url contains '/projects/' %}selected{% endif %}"
          href="{{ base_path }}/projects/">
          Projects
        </a>

        <a
          class="portfolio-nav-link {% if page.url contains '/experience/' %}selected{% endif %}"
          href="{{ base_path }}/experience/">
          Experience
        </a>

        <a
          class="portfolio-nav-link {% if page.url contains '/resume/' %}selected{% endif %}"
          href="{{ base_path }}/resume/">
          Resume
        </a>

        <a
          class="portfolio-nav-link {% if page.url contains '/contact/' %}selected{% endif %}"
          href="{{ base_path }}/contact/">
          Contact
        </a>

      </div>

    </nav>

  </div>
</div>
